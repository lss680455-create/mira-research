  Apple 仍是高质量平台型资产：品牌、软硬件生态与 20 亿级活跃设备构成难复制的护城河，
  现金流与资本回报具备长期韧性；但 2026-04 时点的价格已基本反映其质量，
  属于「值得跟踪持有的优质平台」，而非「明显错杀的弹性机会」。
