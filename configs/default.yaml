# Mira 运行配置（CLI 默认值；环境变量可覆盖，优先级更高）
# 覆盖顺序：内置默认值 < 本文件 < 环境变量（MIRA_AS_OF / MIRA_DUE_SOON_DAYS / MIRA_EVIDENCE_LOG / MIRA_CONFIG）

# 显式 as-of 日期（YYYY-MM-DD）；null 表示取运行当天
as_of: null

# stale_after 距今 <= 该天数 → 判定为 due_soon（临近期）
due_soon_days: 30

# 契约目录
schemas_dir: schemas

# `mira refresh` 未显式指定时使用的默认证据日志（相对仓库根）
evidence_log: examples/aapl-2026-04/evidence-log.csv

# 时区标注（仅用于文档说明；计算全部使用本地日期）
timezone: Asia/Shanghai
